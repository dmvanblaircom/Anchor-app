function getCoachData(week) {
  const keys = Object.keys(COACH_WEEKS).map(Number).sort((a,b)=>a-b);
  return COACH_WEEKS[keys.reduce((p,c)=>Math.abs(c-week)<Math.abs(p-week)?c:p)];
}

      { title: 'Protein Is Critical', body: 'Research consistently links higher protein intake with better birth weights in twin pregnancies. Aim for 150–200g of protein per day — this sounds like a lot because it is. Practical sources: Greek yogurt (17g per cup), eggs (6g each), chicken breast (26g per 3oz), cottage cheese (14g per half cup), salmon (22g per 3oz), and legumes (15g per half cup cooked). Adding protein powder to smoothies is a reasonable tool when appetite is low.' },
      { title: 'Iron Matters More', body: 'Twin pregnancies dramatically increase your blood volume, which means your iron needs are significantly higher. Many OBs recommend supplemental iron (30–60mg elemental iron daily) in addition to your prenatal. Low iron causes extreme fatigue that feels different from pregnancy fatigue — heavier, more cognitive. Have your hemoglobin checked at each trimester, or ask for it if your OB hasn\'t mentioned it.' },
      { title: 'Calcium & Vitamin D', body: 'Both babies are rapidly mineralizing bones — pulling calcium from your stores. Aim for 1,500mg of calcium daily through food and supplementation. Dairy, fortified plant milks, leafy greens, almonds, and sardines are good sources. Vitamin D is critical for calcium absorption and immune function — most prenatals don\'t contain enough; ask your OB about supplementing to 2,000–4,000 IU daily.' },
      { title: 'Hydration Is Non-Negotiable', body: 'Dehydration is a known trigger for uterine contractions — which means in a twin pregnancy it is more than just uncomfortable, it is a preterm labor risk. Aim for a minimum of 12 glasses (96oz) of water daily. Electrolyte drinks (low-sugar options like LMNT or Liquid IV) can help maintain levels, especially in warm weather or after exercise. If your urine is not pale yellow, you are not drinking enough.' },
      { title: 'Weight Gain Guidelines', body: 'The Institute of Medicine recommends 37–54 lbs of total weight gain for twin pregnancies starting at a healthy weight (more for underweight, slightly less for overweight). A guideline breakdown: roughly 1 lb per week in the first trimester, then 1.5 lbs per week after that. Much of this is baby weight, placenta(s), amniotic fluid, and increased blood volume — not fat. Work with your OB on targets specific to your starting weight and pregnancy type.' },
    ]
  },
  {
    id: 'preparing',
    emoji: '🛍️',
    title: 'Preparing for Two',
    color: '#2A6A86',
    intro: 'Getting ready for twins has a learning curve — there\'s a lot of conflicting advice out there. Here\'s what actually matters.',
    items: [
      { title: 'What You Actually Need (vs. What You Don\'t)', body: 'Two of everything sounds obvious but isn\'t always true. You do need: two car seats (non-negotiable), two sets of feeding supplies, two sleep spaces (they can room-share a crib early on, but check safe sleep guidelines). You do not need: two of everything for clothing (babies grow fast and newborn sizing is short-lived), two swings or bouncers immediately (buy one and see), or a twin-specific stroller before you know your lifestyle (test before buying). Resist buying everything before they arrive.' },
      { title: 'Sleep Spaces and Safe Sleep', body: 'The AAP recommends separate sleep surfaces for twins, but many parents safely room-share a crib in the early weeks. The evidence on twin co-sleeping is still evolving — talk to your pediatrician. Bassinets next to your bed make the first weeks much easier for night feeds. A dedicated twin nursing pillow (like the Twin Z or My Brest Friend Twin) is genuinely useful whether you are nursing or bottle feeding.' },
      { title: 'Feeding Decisions', body: 'Breastfeeding twins is possible and many mamas do it successfully — it typically requires more support, a good latch established for each baby individually, and often a lactation consultant who has twin experience. Tandem nursing (feeding both simultaneously) is a skill that takes weeks to develop. Formula supplementation and combination feeding are common with twins and absolutely valid. Make the decision that keeps you and your babies thriving, not the one that looks a certain way.' },
      { title: 'Line Up Help Before Birth', body: 'This is the single most impactful thing you can do. In the first weeks with twins, two adults are the minimum and three is better. Be specific when people offer to help — "bring dinner Tuesday" is more useful than "let me know what you need." If budget allows, a postpartum doula or night nurse for even a few nights per week can be transformative for early twin parenting. Grandparents or trusted family staying for the first 2–4 weeks is not excessive — it is smart.' },
      { title: 'Financial Preparation', body: 'Twins represent a significant financial step-up: doubled diapers, formula if used, doubled childcare costs, potential NICU bills, and the loss of some income during extended leave. Review your insurance coverage for NICU stays specifically (daily limits vary widely). If both parents work, price out twin infant care in your area early — waitlists are long and twin infant spots are rare. Government programs like WIC often cover formula for twins; don\'t overlook these if applicable.' },
    ]
  },
  {
    id: 'heart',
    emoji: '💛',
    title: 'You Are Enough',
    color: '#9A7420',
    intro: 'A word for the twin mama who is wondering if she can do this.',
    items: [
      { title: 'Your Body Is Doing Something Extraordinary', body: 'There is no pregnancy more physically demanding than carrying multiples. The fact that you are doing this — that your body is building two hearts, two spines, two brains simultaneously — is not ordinary. It is remarkable. On the hard days when you feel like you\'re failing, remember that you are actually doing something most people will never do.' },
      { title: 'Fear and Faith Can Coexist', body: 'Worrying about outcomes, monitoring, preterm labor, the NICU — these fears are natural and they don\'t mean you lack faith. Praying over your babies and still being scared is not contradiction; it\'s honesty. Bring both to God. Cast the anxiety on Him who cares for you, and then do the next thing. He knew these two babies before you did.' },
      { title: 'It Is Okay to Grieve the Singleton Experience', body: 'Many twin mamas feel a quiet grief for the calm, low-risk, "normal" pregnancy they imagined. More appointments, more worry, more physical burden — this was not the plan. That grief is real and valid. You can acknowledge it without guilt. You are allowed to wish parts of this were easier while still being grateful for both babies.' },
      { title: 'Community Matters', body: 'Find other twin mamas — in person or online. Organizations like Multiples of America, local Mothers of Multiples clubs, and online communities provide specific, practical, and emotionally resonant support that people without twins genuinely cannot offer. The women who have done this before you are generous with hard-won knowledge.' },
      { title: 'You Will Rise to This', body: 'Every twin mama on the other side of birth says the same thing: "I didn\'t think I could do it, and then I did." Not perfectly, not without hard nights and harder days, but with more love than they thought was possible. Two babies born to a family ready to love them is not a burden — it is a gift, arriving in the most demanding packaging imaginable. You are going to be an incredible mother to both of them.' },
    ]
  },
  {
    id: 'ttts',
    emoji: '⚠️',
    title: 'TTTS, TAPS & MCDA Risks',
    color: '#C0392B',
    intro: 'Your twins are MCDA — mono-chorionic, di-amniotic. This means they share one placenta with blood vessel connections between them. This guide explains the specific risks, how they\'re monitored, and what to do if something is flagged.',
    items: [
      { title: 'What MCDA Means for Your Pregnancy', body: 'Mono-chorionic, di-amniotic (MCDA) twins share one placenta but have separate amniotic sacs. The shared placenta has blood vessel connections between the two babies. In most MCDA pregnancies, this works without problems. But these connections create two specific risks — TTTS and TAPS — that require careful monitoring. Your biweekly growth scans from week 16 forward are specifically designed to catch these early.' },
      { title: 'Twin-to-Twin Transfusion Syndrome (TTTS)', body: 'TTTS occurs when blood flows unevenly through the placental connections — one baby (the donor) sends too much blood to the other (the recipient). The donor becomes smaller with less fluid; the recipient grows larger with too much fluid. TTTS affects roughly 10–15% of MCDA pregnancies. It can progress quickly — from Stage I to Stage IV in days — which is why biweekly monitoring between weeks 16–26 is not optional. The peak window is weeks 16–26, though it can occur any time.' },
      { title: 'Quintero Staging (I–V)', body: 'If TTTS is suspected, your MFM will use the Quintero staging system: Stage I — fluid imbalance visible but donor bladder still visible. Stage II — donor bladder no longer visible. Stage III — abnormal blood flow in one or both babies. Stage IV — hydrops (fluid buildup) in the recipient. Stage V — death of one or both twins. Stages I–II are monitored closely; Stage III+ typically warrants intervention. Understanding this helps you have informed conversations with your MFM.' },
      { title: 'Treatment for TTTS', body: 'The primary treatment for TTTS Stage II and above is fetoscopic laser photocoagulation — a minimally invasive procedure where a specialist uses a laser to seal the blood vessel connections on the placenta. This is done at specialized fetal surgery centers. Success rates at experienced centers are high. In the U.S., major centers include Cincinnati Fetal Center, CHOP, Texas Children\'s Fetal Center, and Children\'s Hospital Colorado. If your MFM mentions TTTS, ask about referral to a fetal surgery center immediately — timing matters.' },
      { title: 'Twin Anemia Polycythemia Sequence (TAPS)', body: 'TAPS is a separate but related condition where small vessel connections cause a slow, chronic imbalance: one twin becomes anemic (too few red blood cells), the other becomes polycythemic (too many). Unlike TTTS, fluid levels may appear normal, making TAPS harder to detect without Doppler measurements. TAPS can occur on its own or after laser treatment for TTTS. It\'s diagnosed via MCA Doppler (middle cerebral artery blood flow speed) at your growth scans. Ask your MFM if MCA Dopplers are part of your monitoring protocol.' },
      { title: 'Selective Intrauterine Growth Restriction (sIUGR)', body: 'sIUGR occurs when one twin is significantly smaller than the other due to unequal placental territory — one baby gets a larger share. Growth discordance of more than 20% between the twins at any growth scan warrants close monitoring and possibly MFM referral. The smaller twin is tracked via Doppler blood flow studies to ensure the placenta is still functioning adequately. Unlike TTTS, sIUGR is not directly related to fluid levels.' },
      { title: 'What to Watch For At Home', body: 'Between scans, your most important signal is comparative movement. You don\'t need to feel exactly how many kicks each baby makes — instead, notice if one baby feels significantly quieter than usual, or if one side of your belly feels different from before. Sudden rapid belly growth (feeling like you\'ve grown overnight), one side feeling much harder than the other, or significant new pressure before 28 weeks are all reasons to call your OB the same day — not wait for your next appointment.' },
      { title: 'Your Monitoring Schedule', body: 'As an MCDA pregnancy, your standard protocol is: growth ultrasound every 2 weeks from week 16 onward, with each scan measuring individual growth, amniotic fluid levels (deepest vertical pocket in each sac), bladder visibility, and Doppler blood flow. Cervical length is typically checked at each visit. An MFM (maternal-fetal medicine specialist) consultation is standard for MCDA pregnancies — if you haven\'t been referred yet, ask. Your OB manages your general pregnancy; your MFM manages the twin-specific risk.' },
      { title: 'If Something Is Flagged', body: 'If your MFM flags a concern — fluid imbalance, growth discordance, abnormal Doppler — stay calm and ask specifically: What stage or level is this? How quickly can this progress? What are we watching next? Should we see a fetal surgery specialist? When is the next scan? You are allowed to ask for a second opinion at any fetal surgery center. TTTS is time-sensitive, but there is almost always time to ask a focused question before making a decision.' },
    ]
  },
];

// ─── UTILITIES ────────────────────────────────────────────────────────────
function parseYMD(s) { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function formatYMD(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function formatDate(ts, time=false) {
  const opts = {month:'short',day:'numeric'};
  if(time){opts.hour='numeric';opts.minute='2-digit';}
  return new Date(ts).toLocaleDateString('en-US',opts);
}
function uid() { return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

function getCurrentGestationalWeek(dueDateYMD) {
  const due = parseYMD(dueDateYMD);
  const lmp = new Date(due); lmp.setDate(lmp.getDate()-280);
  const today = new Date(); today.setHours(0,0,0,0);
  const days = Math.floor((today-lmp)/86400000);
  return { weeks:Math.floor(days/7), dayOfWeek:days%7, days };
}

function getBriefData(week) {
  if(BRIEF_WEEKS[week]) return BRIEF_WEEKS[week];
  const keys = Object.keys(BRIEF_WEEKS).map(Number).sort((a,b)=>a-b);
  return BRIEF_WEEKS[keys.reduce((p,c)=>Math.abs(c-week)<Math.abs(p-week)?c:p)];
}

function getWeekData(week) {
  if(WEEK_DATA[week]) return WEEK_DATA[week];
  const keys = Object.keys(WEEK_DATA).map(Number).sort((a,b)=>a-b);
  return WEEK_DATA[keys.reduce((p,c)=>Math.abs(c-week)<Math.abs(p-week)?c:p)];
}

function generateReport(entries, appointments, week, days, config) {
  const cutoff = Date.now()-days*86400000;
  const recent = entries.filter(e=>e.timestamp>=cutoff);
  const dateStr = new Date().toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
  const sevLabels={1:'Mild',2:'Moderate',3:'Rough'};
  const bySymptom={};
  recent.forEach(e=>{
    if(!bySymptom[e.symptomId])bySymptom[e.symptomId]={total:0,mild:0,moderate:0,rough:0};
    bySymptom[e.symptomId].total++;
    if(e.severity===1)bySymptom[e.symptomId].mild++;
    if(e.severity===2)bySymptom[e.symptomId].moderate++;
    if(e.severity===3)bySymptom[e.symptomId].rough++;
  });
  const sorted=Object.entries(bySymptom).sort((a,b)=>b[1].total-a[1].total);
  const maxC=sorted[0]?.[1]?.total||1;
  const B='█',E='░';
  const twinDesc = `${config.chorionicity==='mono'?'Mono':'Di'}-chorionic ${config.amnionicity==='mono'?'mono':'di'}-amniotic ${config.twinType||'twin'} pregnancy`;
  let r=`TWIN PREGNANCY SYMPTOM REPORT\n${'═'.repeat(40)}\nFor: ${config.motherName}\nGenerated: ${dateStr}\nWeek: ${week} · ${twinDesc}\nPeriod: Last ${days} days · ${recent.length} total entries\n\n`;
  if(sorted.length===0){r+=`No entries in the last ${days} days.\n`;}
  else{
    r+=`SYMPTOM FREQUENCY\n${'─'.repeat(40)}\n`;
    sorted.forEach(([id,d])=>{
      const sym=SYMPTOMS.find(s=>s.id===id)||MOVEMENT_LOG||TTTS_SYMPTOM;
      if(!sym)return;
      const filled=Math.round((d.total/maxC)*8);
      r+=`${sym.label.padEnd(22).substring(0,22)} ${B.repeat(filled)}${E.repeat(8-filled)}  ${d.total}x\n`;
      r+=`  Mild:${d.mild} Moderate:${d.moderate} Rough:${d.rough}\n`;
    });
    const notes=recent.filter(e=>e.note).slice(0,15);
    if(notes.length>0){
      r+=`\nNOTES\n${'─'.repeat(40)}\n`;
      notes.forEach(e=>{
        const sym=SYMPTOMS.find(s=>s.id===e.symptomId)||MOVEMENT_LOG||TTTS_SYMPTOM;
        if(!sym)return;
        const baby=e.baby?` · Baby ${e.baby}`:'';
        r+=`${formatDate(e.timestamp)} · ${sym.label}${baby} · ${sevLabels[e.severity]||''}\n  "${e.note}"\n`;
      });
    }
    const ttts=recent.filter(e=>e.symptomId==='ttts');
    if(ttts.length>0){r+=`\n⚠️ TTTS WARNING SIGNS LOGGED: ${ttts.length}\n${'─'.repeat(40)}\n`;ttts.forEach(e=>{r+=`${formatDate(e.timestamp,true)}: "${e.note||'(no note)'}"\n`;});}
    const mov=recent.filter(e=>e.symptomId==='movement');
    if(mov.length>0){
      const sm={1:'Quiet',2:'Normal',3:'Very Active'};
      r+=`\nBABY MOVEMENT (${mov.length} entries)\n${'─'.repeat(40)}\n`;
      mov.slice(0,10).forEach(e=>{r+=`${formatDate(e.timestamp)} · Baby ${e.baby||'?'} · ${sm[e.severity]||''}${e.note?` — "${e.note}"`:''}\n`;});
    }
  }
  const appts=(appointments||[]).filter(a=>{const t=parseYMD(a.date).getTime();return t>=cutoff&&t<=Date.now();});
  if(appts.length>0){
    r+=`\nAPPOINTMENTS\n${'─'.repeat(40)}\n`;
    appts.forEach(a=>{
      r+=`${new Date(parseYMD(a.date)).toLocaleDateString('en-US',{weekday:'short',month:'long',day:'numeric'})} · ${a.title||'OB Visit'}\n`;
      if(a.provider)r+=`  Provider: ${a.provider}\n`;
      if(a.babyAWeight||a.babyBWeight)r+=`  Growth: A ${a.babyAWeight||'—'} · B ${a.babyBWeight||'—'}${a.discordance?' · Disc: '+a.discordance:''}\n`;
      if(a.cervicalLength)r+=`  Cervical length: ${a.cervicalLength}\n`;
      if(a.notes)r+=`  ${a.notes}\n`;
    });
  }
  r+=`\n${'─'.repeat(40)}\nTracked with Anchor`;
  return r;
}

// ─── APP ─────────────────────────────────────────────────────────────────
function App() {
  const [config, setConfig] = useState(()=>{
    try{const s=localStorage.getItem('anc-config');if(s)return{...DEFAULT_CONFIG,...JSON.parse(s)};}catch{}
    return DEFAULT_CONFIG;
  });
  useEffect(()=>{localStorage.setItem('anc-config',JSON.stringify(config));},[config]);

  const currentGW = getCurrentGestationalWeek(config.dueDate);
  const [viewWeek, setViewWeek] = useState(()=>{
    const s=parseInt(localStorage.getItem('anc-week')||'');
    return isNaN(s)?Math.min(40,Math.max(4,currentGW.weeks)):s;
  });
  useEffect(()=>{localStorage.setItem('anc-week',viewWeek);},[viewWeek]);

  const [entries, setEntries] = useState(()=>{try{return JSON.parse(localStorage.getItem('anc-entries')||'[]');}catch{return [];}});
  const [appointments, setAppointments] = useState(()=>{try{return JSON.parse(localStorage.getItem('anc-appts')||'[]');}catch{return [];}});
  const [tasks, setTasks] = useState(()=>{
    try{
      const s=localStorage.getItem('anc-tasks');
      if(s)return JSON.parse(s);
    }catch{}
    return DEFAULT_TASKS.map(t=>({...t}));
  });
  useEffect(()=>{localStorage.setItem('anc-entries',JSON.stringify(entries));},[entries]);
  useEffect(()=>{localStorage.setItem('anc-appts',JSON.stringify(appointments));},[appointments]);
  useEffect(()=>{localStorage.setItem('anc-tasks',JSON.stringify(tasks));},[tasks]);

  const [tab, setTab] = useState('brief');
  const [showSettings, setShowSettings] = useState(false);
  const [editingAppt, setEditingAppt] = useState(null);
  const [addingTask, setAddingTask] = useState(false);
  const [coachOpen, setCoachOpen] = useState(null);
  const [coachItem, setCoachItem] = useState(null);
  const [reportDays, setRptDays] = useState(14);
  const [copied, setCopied] = useState(false);

  // Sync import
  useEffect(()=>{
    const hash=window.location.hash;
    if(!hash.startsWith('#sync='))return;
    try{
      const payload=JSON.parse(atob(decodeURIComponent(hash.slice(6))));
      if(window.confirm(`Import shared data?\n${payload.entries?.length||0} logs · ${payload.appointments?.length||0} appointments`)){
        const me=[...entries];
        (payload.entries||[]).forEach(e=>{if(!me.find(x=>x.id===e.id))me.push(e);});
        const ma=[...appointments];
        (payload.appointments||[]).forEach(a=>{
          const i=ma.findIndex(x=>x.id===a.id);
          if(i===-1)ma.push(a); else if(a.updatedAt>ma[i].updatedAt)ma[i]=a;
        });
        setEntries(me.sort((a,b)=>b.timestamp-a.timestamp));
        setAppointments(ma);
      }
      window.history.replaceState(null,'',window.location.pathname);
    }catch{}
  },[]);

  function toggleTask(id) { setTasks(prev=>prev.map(t=>t.id===id?{...t,done:!t.done}:t)); }
  function addTask(task) { setTasks(prev=>[...prev,{...task,id:uid(),done:false,custom:true}]); }
  function deleteTask(id) { setTasks(prev=>prev.filter(t=>t.id!==id)); }

  function saveAppt(appt) {
    const now=Date.now();
    if(appt.id&&appointments.find(a=>a.id===appt.id)){
      setAppointments(prev=>prev.map(a=>a.id===appt.id?{...appt,updatedAt:now}:a));
    } else {
      setAppointments(prev=>[...prev,{...appt,id:uid(),updatedAt:now}]);
    }
  }

  async function shareReport() {
    const text=generateReport(entries,appointments,viewWeek,reportDays,config);
    if(navigator.share){try{await navigator.share({title:'Twin Pregnancy Report',text});return;}catch{}}
    try{await navigator.clipboard.writeText(text);}catch{const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);}
    setCopied(true);setTimeout(()=>setCopied(false),2500);
  }

  const dueDateObj = parseYMD(config.dueDate);
  const today = new Date(); today.setHours(0,0,0,0);
  const daysLeft = Math.floor((dueDateObj-today)/86400000);
  const isCurrentWeek = viewWeek===currentGW.weeks;

  const TABS = [
    {id:'brief',   label:'Brief',   icon:'⚓'},
    {id:'herweek', label:'Her Week', icon:'💛'},
    {id:'tasks',   label:'Tasks',   icon:'✓'},
    {id:'visits',  label:'Visits',  icon:'🏥'},
    {id:'report',  label:'Report',  icon:'📋'},
  ];

  return (
    <div style={{display:'flex',flexDirection:'column',height:'100dvh',maxWidth:480,margin:'0 auto',background:'var(--bg)'}}>

      {/* HEADER — navy, always visible */}
      <div style={{background:`linear-gradient(180deg, var(--navy2) 0%, var(--navy) 100%)`,padding:'calc(env(safe-area-inset-top,0px) + 12px) 18px 10px',flexShrink:0}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>
          <div>
            <div style={{fontFamily:"'Inter', sans-serif",fontSize:17,fontWeight:700,color:'#fff',letterSpacing:'0.18em',textTransform:'uppercase'}}>
              ⚓ Anchor
            </div>
            <div style={{fontSize:11,color:'rgba(200,164,74,0.85)',letterSpacing:'0.18em',textTransform:'uppercase',marginTop:3,fontWeight:500}}>
              Be the calm in the storm
            </div>
          </div>
          <button onClick={()=>setShowSettings(true)} style={{background:'rgba(200,164,74,0.15)',border:'1px solid rgba(200,164,74,0.25)',width:32,height:32,borderRadius:'50%',cursor:'pointer',fontSize:16,display:'flex',alignItems:'center',justifyContent:'center',color:'rgba(255,255,255,0.8)'}}>⚙</button>
        </div>

        {/* Week navigator */}
        <div style={{display:'flex',alignItems:'center',gap:10,background:'rgba(0,0,0,0.4)',borderRadius:10,padding:'8px 12px'}}>
          <button className="week-btn" disabled={viewWeek<=4} onClick={()=>setViewWeek(w=>Math.max(4,w-1))}>‹</button>
          <div style={{flex:1,textAlign:'center',cursor:'pointer'}} onClick={()=>setViewWeek(currentGW.weeks)}>
            <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:19,fontWeight:600,color:'#fff',lineHeight:1}}>
              Week {viewWeek}
              {!isCurrentWeek && <span style={{fontSize:11,color:'var(--gold)',marginLeft:8,fontFamily:"'Inter', sans-serif",fontWeight:500,textTransform:'uppercase',letterSpacing:'0.05em'}}>preview</span>}
            </div>
            <div style={{fontSize:11,color:'rgba(255,255,255,0.75)',marginTop:2,letterSpacing:'0.03em'}}>
              {isCurrentWeek
                ? `${currentGW.weeks}w ${currentGW.dayOfWeek}d · ${parseYMD(config.dueDate).toLocaleDateString('en-US',{month:'short',day:'numeric'})} · ${daysLeft}d to go`
                : `tap to return to week ${currentGW.weeks}`}
            </div>
          </div>
          <button className="week-btn" disabled={viewWeek>=40} onClick={()=>setViewWeek(w=>Math.min(40,w+1))}>›</button>
        </div>
      </div>

      {/* TAB BAR */}
      <div style={{display:'flex',background:' var(--navy)',borderBottom:'1px solid rgba(255,255,255,0.08)',flexShrink:0}}>
        {TABS.map(t=>(
          <button key={t.id} className="tab" onClick={()=>setTab(t.id)}
            style={{color: tab===t.id?'#fff':'rgba(255,255,255,0.68)', borderBottom: tab===t.id?'2px solid var(--gold)':'2px solid transparent', paddingBottom:8}}>
            <span style={{fontSize:16}}>{t.icon}</span>
            <span>{t.label}</span>
          </button>
        ))}
      </div>

      {/* CONTENT */}
      <div style={{flex:1,overflowY:'auto',padding:'14px 14px 28px'}}>

        {tab==='brief' && <BriefTab week={viewWeek} config={config} currentGW={currentGW} entries={entries} tasks={tasks} onGoToTasks={()=>setTab('tasks')} />}
        {tab==='herweek' && <HerWeekTab week={viewWeek} config={config} entries={entries} setEntries={setEntries} coachOpen={coachOpen} setCoachOpen={setCoachOpen} coachItem={coachItem} setCoachItem={setCoachItem} />}
        {tab==='tasks' && <TasksTab tasks={tasks} week={currentGW.weeks} onToggle={toggleTask} onDelete={deleteTask} onAdd={()=>setAddingTask(true)} />}
        {tab==='visits' && <VisitsTab appointments={appointments} onNew={()=>setEditingAppt({date:formatYMD(new Date()),title:'',provider:'',questions:'',notes:'',babyAWeight:'',babyBWeight:'',discordance:'',cervicalLength:''})} onEdit={setEditingAppt} />}
        {tab==='report' && <ReportTab entries={entries} appointments={appointments} week={viewWeek} reportDays={reportDays} setRptDays={setRptDays} copied={copied} onShare={shareReport} onClear={()=>{if(window.confirm('Clear all symptom logs?'))setEntries([]);}} config={config} />}

      </div>

      {/* MODALS */}
      {showSettings && <SettingsModal config={config} setConfig={setConfig} onClose={()=>setShowSettings(false)} />}
      {editingAppt && <ApptModal appt={editingAppt} onSave={a=>{saveAppt(a);setEditingAppt(null);}} onClose={()=>setEditingAppt(null)} onDelete={id=>{setAppointments(prev=>prev.filter(a=>a.id!==id));setEditingAppt(null);}} />}
      {addingTask && <AddTaskModal onSave={t=>{addTask(t);setAddingTask(false);}} onClose={()=>setAddingTask(false)} />}
    </div>
  );
}

// ─── TASKS TAB ────────────────────────────────────────────────────────────
function TasksTab({ tasks, week, onToggle, onDelete, onAdd }) {
  const [filter, setFilter] = useState('now');

  const filtered = tasks.filter(t=>{
    if(filter==='all') return true;
    if(filter==='now') return !t.done && t.targetWeek<=week+1;
    return t.category===filter;
  });
  const done = filtered.filter(t=>t.done);
  const pending = filtered.filter(t=>!t.done);

  const total = tasks.length;
  const completed = tasks.filter(t=>t.done).length;
  const pct = total>0?Math.round((completed/total)*100):0;

  return (
    <div>
      {/* Progress */}
      <div className="card" style={{marginBottom:12}}>
        <div style={{display:'flex',justifyContent:'space-between',marginBottom:6}}>
          <span style={{fontSize:13,color:'var(--muted)',fontWeight:500}}>{completed} of {total} complete</span>
          <span style={{fontSize:13,color:'var(--sage)',fontWeight:600}}>{pct}%</span>
        </div>
        <div className="prog-bar">
          <div className="prog-fill" style={{width:`${pct}%`}}/>
        </div>
      </div>

      {/* Filter */}
      <div className="filter-scroll" style={{marginBottom:12}}>
        {TASK_CATEGORIES.map(c=>(
          <div key={c.id} className={`filter-pill ${filter===c.id?'active':''}`} onClick={()=>setFilter(c.id)}>
            {c.emoji} {c.label}
          </div>
        ))}
      </div>

      {/* Pending */}
      {pending.length===0 && filter==='now' && (
        <div style={{textAlign:'center',padding:'40px 20px'}}>
          <div style={{fontSize:44,marginBottom:12}}>✓</div>
          <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:22,color:'var(--text2)',marginBottom:6}}>All caught up</div>
          <div style={{fontSize:16,color:'var(--muted)',lineHeight:1.6}}>Nothing due right now. Check "All" to see everything or look ahead.</div>
        </div>
      )}
      {pending.length>0 && <div style={{marginBottom:10}}>{pending.map(t=><TaskRow key={t.id} task={t} onToggle={onToggle} onDelete={onDelete}/>)}</div>}

      {/* Done */}
      {done.length>0 && (
        <div style={{marginTop:8}}>
          <div className="sec-label" style={{marginLeft:2,marginBottom:8,color:'var(--sage)'}}>Completed — {done.length}</div>
          {done.map(t=><TaskRow key={t.id} task={t} onToggle={onToggle} onDelete={onDelete}/>)}
        </div>
      )}

      {/* Add */}
      <button className="btn btn-ghost" onClick={onAdd} style={{marginTop:14,width:'100%'}}>+ Add Task</button>
    </div>
  );
}

function TaskRow({ task, onToggle, onDelete }) {
  const catColors = {'Medical':'#2A6A86','Nursery':'#6050A0','Home':'#8B7355','Financial':'#9A7420','Postpartum':'#4A7E28','For Laura':'#B85A38'};
  const color = catColors[task.category]||'var(--muted)';
  return (
    <div style={{display:'flex',alignItems:'flex-start',gap:12,padding:'11px 14px',background:'var(--card)',borderRadius:12,marginBottom:8,border:'1px solid var(--border)',opacity:task.done?0.6:1}}>
      <div className={`task-check ${task.done?'done':''}`} onClick={()=>onToggle(task.id)}>
        {task.done && <span style={{color:'#fff',fontSize:13,fontWeight:700}}>✓</span>}
      </div>
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontSize:16,color:task.done?'var(--muted)':'var(--dark)',textDecoration:task.done?'line-through':'none',lineHeight:1.5}}>{task.title}</div>
        <div style={{display:'flex',gap:6,marginTop:4,alignItems:'center'}}>
          <span style={{fontSize:11,color:color,fontWeight:500}}>{task.emoji} {task.category}</span>
          <span style={{fontSize:11,color:'var(--muted)'}}>· Wk {task.targetWeek}</span>
        </div>
      </div>
      {task.custom && <span onClick={()=>{if(window.confirm('Delete this task?'))onDelete(task.id);}} style={{fontSize:18,color:'var(--muted)',cursor:'pointer',padding:'0 4px'}}>×</span>}
    </div>
  );
}

function AddTaskModal({ onSave, onClose }) {
  const [title, setTitle] = useState('');
  const [category, setCategory] = useState('Home');
  const [targetWeek, setTargetWeek] = useState(8);
  const cats = ['Medical','Nursery','Home','Financial','Postpartum','For Laura'];
  return (
    <div className="modal-back" onClick={onClose}>
      <div className="modal-sheet" onClick={e=>e.stopPropagation()}>
        <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:24,fontWeight:600,color:'var(--text2)',marginBottom:16}}>Add Task</div>
        <div className="sec-label">What needs to happen</div>
        <textarea className="note-input" rows={2} value={title} onChange={e=>setTitle(e.target.value)} placeholder="e.g. Order compression socks for Laura" style={{marginBottom:14}}/>
        <div className="sec-label">Category</div>
        <div style={{display:'flex',flexWrap:'wrap',gap:8,marginBottom:14}}>
          {cats.map(c=>(
            <button key={c} onClick={()=>setCategory(c)}

              {c}
            </button>
          ))}
        </div>
        <div className="sec-label">Target week</div>
        <input type="number" className="text-input" value={targetWeek} min={4} max={40} onChange={e=>setTargetWeek(parseInt(e.target.value)||4)} style={{marginBottom:20}}/>
        <button className="btn btn-navy" disabled={!title.trim()} onClick={()=>onSave({title,category,emoji:'📋',targetWeek})}>Add Task</button>
        <button className="btn-ghost" onClick={onClose} style={{width:'100%',marginTop:10}}>Cancel</button>
      </div>
    </div>
  );
}

// ─── VISITS TAB ───────────────────────────────────────────────────────────
function VisitsTab({ appointments, onNew, onEdit }) {
  const now = new Date(); now.setHours(0,0,0,0);
  const sorted = [...appointments].sort((a,b)=>parseYMD(b.date)-parseYMD(a.date));
  const upcoming = sorted.filter(a=>parseYMD(a.date)>=now).reverse();
  const past = sorted.filter(a=>parseYMD(a.date)<now);

  return (
    <div>
      <button className="btn" onClick={onNew} style={{background:'linear-gradient(135deg,var(--sky),#3A6F83)',color:'#fff',marginBottom:14}}>+ New Appointment</button>
      {appointments.length===0 && (
        <div style={{textAlign:'center',padding:'50px 20px'}}>
          <div style={{fontSize:48,marginBottom:12}}>🏥</div>
          <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:22,color:'var(--text2)',marginBottom:6}}>No appointments yet</div>
          <div style={{fontSize:16,color:'var(--muted)',lineHeight:1.6}}>Track OB visits, MFM appointments, growth scans, and questions asked and answered.</div>
        </div>
      )}
      {upcoming.length>0 && (
        <>
          <div className="sec-label">Upcoming</div>
          {upcoming.map(a=><ApptCard key={a.id} appt={a} onEdit={()=>onEdit(a)} isPast={false}/>)}
        </>
      )}
      {past.length>0 && (
        <>
          <div className="sec-label" style={{marginTop:16}}>Past</div>
          {past.map(a=><ApptCard key={a.id} appt={a} onEdit={()=>onEdit(a)} isPast={true}/>)}
        </>
      )}
    </div>
  );
}

function ApptCard({ appt, onEdit, isPast }) {
  const d = parseYMD(appt.date);
  const type = APPT_TYPES.find(t=>t.id===appt.apptType);
  return (
    <div className="card card-tap" style={{marginBottom:10,opacity:isPast?0.8:1}} onClick={onEdit}>
      <div style={{display:'flex',alignItems:'flex-start',gap:12}}>
        <div style={{flexShrink:0,textAlign:'center',background:isPast?'var(--card2)':`${type?.color||'#2A6A86'}18`,borderRadius:10,padding:'6px 10px',minWidth:48}}>
          <div style={{fontSize:11,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'0.06em',fontWeight:500}}>{d.toLocaleDateString('en-US',{month:'short'})}</div>
          <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:22,fontWeight:600,color:'var(--text2)',lineHeight:1}}>{d.getDate()}</div>
          {type&&<div style={{fontSize:16,marginTop:2}}>{type.emoji}</div>}
        </div>
        <div style={{flex:1}}>
          <div style={{fontSize:16,fontWeight:500,color:'var(--text2)'}}>{appt.title||'Appointment'}</div>
          {type&&<div style={{fontSize:12,color:type.color,fontWeight:600,textTransform:'uppercase',letterSpacing:'0.05em',marginTop:1}}>{type.label}</div>}
          {appt.provider&&<div style={{fontSize:13,color:'var(--muted)',marginTop:1}}>with {appt.provider}</div>}
          {(appt.babyAWeight||appt.babyBWeight||appt.discordance||appt.cervicalLength)&&(
            <div style={{display:'flex',flexWrap:'wrap',gap:6,marginTop:6}}>
              {appt.babyAWeight&&<span style={{fontSize:11,background:'rgba(42,106,134,0.12)',color:'var(--sky)',borderRadius:6,padding:'2px 8px',fontWeight:500}}>A: {appt.babyAWeight}</span>}

            <div style={{display:'flex',gap:6,marginTop:6}}>
              {appt.babyAReactive&&<span style={{fontSize:11,background:appt.babyAReactive==='Yes'?'rgba(74,126,40,0.1)':'rgba(176,32,32,0.1)',color:appt.babyAReactive==='Yes'?'#4A7E28':'#8B2020',borderRadius:6,padding:'2px 8px',fontWeight:500}}>A: {appt.babyAReactive}</span>}

        </div>

    </div>
  );
}

// ─── VALIDATED FIELD COMPONENTS (top-level — stable refs, no focus loss) ────
function NumField({label, fieldKey, value, onChange, min, max, unit, hint, warn, warnAbove, warnBelow}) {
  const raw = value || '';
  const num = parseFloat(raw);
  const hasVal = raw !== '' && !isNaN(num);
  const outOfRange = hasVal && (num < min || num > max);
  const isWarn = hasVal && ((warnAbove !== undefined && num > warnAbove) || (warnBelow !== undefined && num < warnBelow));
  const borderColor = outOfRange ? '#B02020' : isWarn ? '#B85A38' : 'var(--border2)';
  const statusMsg = outOfRange
    ? `Must be ${min}–${max}${unit ? ' ' + unit : ''}`
    : isWarn && warn ? warn : hint || '';
  const statusColor = outOfRange ? '#B02020' : isWarn ? '#B85A38' : 'var(--muted)';

  function handleChange(e) {
    const v = e.target.value;
    if(v === '' || /^\d*\.?\d*$/.test(v)) {
      const n = parseFloat(v);
      if(v !== '' && !isNaN(n) && n > max) return;
      onChange(v);
    }
  }

  return (
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginBottom:4}}>
        <div className="sec-label" style={{marginBottom:0}}>{label}</div>
        {unit && <div style={{fontSize:10,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'0.06em'}}>{unit}</div>}
      </div>
      <input
        className="text-input"
        inputMode="decimal"
        value={raw}
        placeholder={`${min}–${max}`}
        onChange={handleChange}
        style={{borderColor, marginBottom: statusMsg ? 4 : 8, background: outOfRange ? 'rgba(176,32,32,0.04)' : ''}}
      />
      {statusMsg && <div style={{fontSize:11,color:statusColor,marginBottom:8,paddingLeft:2}}>{outOfRange ? '⛔ ' : isWarn ? '⚠️ ' : ''}{statusMsg}</div>}
    </div>
  );
}

function WeightField({label, value, onChange}) {
  const raw = value || '';
  const invalid = raw !== '' && !/^[\d\s.lbozg]*$/i.test(raw);
  return (
    <div>
      <div className="sec-label">{label}</div>
      <input
        className="text-input"
        value={raw}
        placeholder="e.g. 1 lb 6 oz or 650g"
        onChange={e => onChange(e.target.value)}
        style={{borderColor: invalid ? '#B02020' : 'var(--border2)', marginBottom: invalid ? 2 : 8}}
      />
      {invalid && <div style={{fontSize:11,color:'#B02020',marginBottom:8,paddingLeft:2}}>⛔ Use format: 1 lb 6 oz or 650g</div>}
    </div>
  );
}

function ApptModal({ appt, onSave, onClose, onDelete }) {
  const isNew = !appt.id;
  const [step, setStep] = useState(isNew ? 'type' : 'form');
  const [d, setD] = useState(appt);
  const u = patch => setD(prev=>({...prev,...patch}));

  const apptType = APPT_TYPES.find(t=>t.id===d.apptType) || APPT_TYPES[APPT_TYPES.length-1];

  function selectType(type) {
    setD(prev=>({
      ...prev,
      apptType: type.id,
      title: type.label,
      questions: '',
    }));
    setStep('form');
  }

  function addQ(q) {
    const existing = d.questions || '';
    const already = existing.split('\n').map(s=>s.trim());
    if(already.includes(q.trim())) return;
    u({questions: existing ? existing+'\n'+q : q});
  }

  const Header = ({title}) => (
    <div style={{background:'var(--navy)',padding:'calc(env(safe-area-inset-top,0px)+14px) 20px 14px',display:'flex',alignItems:'center',justifyContent:'space-between',flexShrink:0}}>
      <div style={{display:'flex',alignItems:'center',gap:10}}>
        {step==='form'&&isNew&&<button onClick={()=>setStep('type')} style={{background:'rgba(255,255,255,0.15)',border:'none',color:'#fff',width:28,height:28,borderRadius:'50%',cursor:'pointer',fontSize:14,display:'flex',alignItems:'center',justifyContent:'center'}}>‹</button>}
        <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:22,fontWeight:600,color:'#fff'}}>{title}</div>
      </div>
      <button onClick={onClose} style={{background:'rgba(255,255,255,0.15)',border:'none',color:'#fff',width:30,height:30,borderRadius:'50%',cursor:'pointer',fontSize:18,display:'flex',alignItems:'center',justifyContent:'center'}}>✕</button>
    </div>
  );

  // ── STEP 1: Type picker ─────────────────────────────────────────────────
  if(step==='type') return (
    <div className="modal-full">
      <Header title="Appointment Type" />
      <div style={{flex:1,overflowY:'auto',padding:'16px 16px 32px'}}>
        <div style={{fontSize:14,color:'var(--muted)',marginBottom:16,lineHeight:1.5}}>Select the type to load the right template, fields, and questions.</div>
        {APPT_TYPES.map(type=>(
          <div key={type.id} className="card card-tap" style={{marginBottom:10,borderLeft:`3px solid ${type.color}`}} onClick={()=>selectType(type)}>
            <div style={{display:'flex',alignItems:'center',gap:12}}>
              <span style={{fontSize:24,flexShrink:0}}>{type.emoji}</span>
              <div style={{flex:1}}>
                <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:17,fontWeight:600,color:'var(--text2)'}}>{type.label}</div>
                <div style={{fontSize:13,color:'var(--muted)',marginTop:1}}>{type.subtitle}</div>
              </div>
              <span style={{color:'var(--muted)',fontSize:18}}>›</span>
            </div>
          </div>
        ))}
      </div>
    </div>
  );

  // ── STEP 2: Form ────────────────────────────────────────────────────────
  return (
    <div className="modal-full">
      <Header title={isNew?'New Appointment':'Edit Appointment'} />
      <div style={{flex:1,overflowY:'auto',padding:'16px 16px 32px'}}>

        {/* Type badge */}
        <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:14,padding:'8px 12px',background:apptType.color+'15',borderRadius:8,border:`1px solid ${apptType.color}38`}}>
          <span style={{fontSize:18}}>{apptType.emoji}</span>
          <div style={{flex:1}}>
            <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:15,fontWeight:600,color:apptType.color}}>{apptType.label}</div>
            <div style={{fontSize:11,color:'var(--muted)'}}>{apptType.subtitle}</div>
          </div>
          {isNew&&<span onClick={()=>setStep('type')} style={{fontSize:12,color:'var(--sky)',cursor:'pointer',fontWeight:600}}>Change</span>}
        </div>

        <div className="sec-label">Date</div>
        <input type="date" className="text-input" value={d.date} onChange={e=>u({date:e.target.value})} style={{marginBottom:14}}/>

        <div className="sec-label">Title</div>
        <input className="text-input" value={d.title} placeholder="Appointment title" onChange={e=>u({title:e.target.value})} style={{marginBottom:14}}/>

        <div className="sec-label">Provider / Location</div>
        <input className="text-input" value={d.provider||''} placeholder="OB name, MFM clinic, hospital..." onChange={e=>u({provider:e.target.value})} style={{marginBottom:14}}/>

        {/* Questions */}
        <div className="sec-label">Questions to ask</div>
        <textarea className="note-input" rows={3} value={d.questions||''} placeholder="One per line..." onChange={e=>u({questions:e.target.value})} style={{marginBottom:8}}/>
        <div style={{background:'var(--card2)',borderRadius:8,padding:'10px 12px',marginBottom:14}}>
          <div style={{fontSize:11,color:'var(--muted)',marginBottom:8,fontWeight:600,textTransform:'uppercase',letterSpacing:'0.08em'}}>Tap to add — {apptType.label} questions</div>
          {apptType.questions.length===0
            ? <div style={{fontSize:13,color:'var(--muted)',fontStyle:'italic'}}>Add your own questions above</div>
            : apptType.questions.map((q,i)=>{
                const added = (d.questions||'').split('\n').map(s=>s.trim()).includes(q.trim());
                return (
                  <div key={i} onClick={()=>!added&&addQ(q)}
                    style={{display:'flex',gap:8,padding:'7px 0',borderBottom:i<apptType.questions.length-1?'1px solid var(--border)':'none',cursor:added?'default':'pointer',opacity:added?0.4:1}}>
                    <span style={{color:added?'var(--muted)':apptType.color,fontSize:15,flexShrink:0,fontWeight:700}}>{added?'✓':'+'}</span>
                    <span style={{fontSize:13,color:'var(--muted2)',lineHeight:1.5}}>{q}</span>

        </div>

              {[{label:'Baby A reactive?', key:'babyAReactive'},{label:'Baby B reactive?', key:'babyBReactive'}].map(({label,key})=>(
                <div key={key}>
                  <div className="sec-label">{label}</div>
                  <div style={{display:'flex',gap:5}}>
                    {[{v:'Yes',c:'#4A7E28'},{v:'No',c:'#B02020'},{v:'Borderline',c:'#9A7420'}].map(({v,c})=>(
                      <button key={v} onClick={()=>u({[key]:v})}
                        style={{flex:1,padding:'7px 3px',border:`1.5px solid ${d[key]===v?c:'var(--border)'}`,borderRadius:6,background:d[key]===v?c+'22':'transparent',color:d[key]===v?c:'var(--muted)',fontFamily:"'Inter',sans-serif",fontSize:11,cursor:'pointer',fontWeight:d[key]===v?700:400,transition:'all 0.12s'}}>

                      </button>
                    ))}
                  </div>
                </div>

            </div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
              <NumField label="Baby A heart rate" value={d.babyAHR} onChange={v=>u({babyAHR:v})} min={60} max={220} unit="bpm"
                hint="Normal fetal HR: 110–160 bpm" warnAbove={180} warnBelow={100}
                warn="Outside normal fetal range — confirm with provider" />
              <NumField label="Baby B heart rate" value={d.babyBHR} onChange={v=>u({babyBHR:v})} min={60} max={220} unit="bpm"
                hint="Normal fetal HR: 110–160 bpm" warnAbove={180} warnBelow={100}
                warn="Outside normal fetal range — confirm with provider" />
            </div>
          </div>
        )}

        {/* MCDA growth fields */}
        {apptType.showMCDA&&(
          <div style={{background:'var(--card2)',borderRadius:8,padding:'12px 14px',marginBottom:14}}>
            <div className="sec-label" style={{marginBottom:12}}>Growth Measurements</div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:4}}>
              <WeightField label="Baby A weight" value={d.babyAWeight} onChange={v=>u({babyAWeight:v})} />

            </div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
              <NumField label="Discordance" value={d.discordance} onChange={v=>u({discordance:v})} min={0} max={100} step={0.1} unit="%"
                hint="Normal: under 20%. Flag if ≥20%." warnAbove={20}
                warn="≥20% discordance — notify MFM if not already aware" />
              <NumField label="Cervical length" value={d.cervicalLength} onChange={v=>u({cervicalLength:v})} min={0} max={80} step={0.1} unit="mm"
                hint="Normal: 25–50 mm" warnBelow={25}
                warn="Short cervix — discuss with OB" />
            </div>
          </div>
        )}

        <div className="sec-label">Notes / Answers</div>
        <textarea className="note-input" rows={5} value={d.notes||''} placeholder="What you learned, what was said, next steps..." onChange={e=>u({notes:e.target.value})} style={{marginBottom:20}}/>

        <button className="btn" onClick={()=>onSave(d)} style={{background:'var(--navy)',color:'#fff'}}>
          {isNew?'Save Appointment':'Update Appointment'}
        </button>
        {!isNew&&<button className="btn-ghost" onClick={()=>{if(window.confirm('Delete this appointment?'))onDelete(appt.id);}} style={{width:'100%',marginTop:10,color:'var(--terra)',borderColor:'#E8CFC5'}}>Delete Appointment</button>}
        <button className="btn-ghost" onClick={onClose} style={{width:'100%',marginTop:10}}>Cancel</button>
      </div>
    </div>
  );
}

// ─── REPORT TAB ───────────────────────────────────────────────────────────
function ReportTab({ entries, appointments, week, reportDays, setRptDays, copied, onShare, onClear, config }) {
  const cutoff = Date.now()-reportDays*86400000;
  const recent = entries.filter(e=>e.timestamp>=cutoff);
  const bySymp = {};
  recent.forEach(e=>{bySymp[e.symptomId]=(bySymp[e.symptomId]||0)+1;});
  const sorted = Object.entries(bySymp).sort((a,b)=>b[1]-a[1]);
  const maxC = sorted[0]?.[1]||1;

  return (
    <div>
      <div className="card" style={{marginBottom:12}}>
        <div className="sec-label">Report period</div>
        <div style={{display:'flex',gap:8}}>
          {[7,14,30].map(d=>(
            <button key={d} onClick={()=>setRptDays(d)}
              style={{flex:1,padding:'10px',border:`1.5px solid ${reportDays===d?'var(--navy)':'var(--border)'}`,borderRadius:12,background:reportDays===d?'var(--navy)':'#fff',color:reportDays===d?'#fff':'var(--dark)',fontFamily:"'Inter', sans-serif",fontSize:16,cursor:'pointer',fontWeight:reportDays===d?500:400}}>
              {d} days
            </button>
          ))}
        </div>
      </div>

      {recent.length===0?(
        <div className="card" style={{textAlign:'center',padding:'40px 20px',marginBottom:12}}>
          <div style={{fontSize:44,marginBottom:12}}>📋</div>
          <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:22,color:'var(--text2)',marginBottom:8}}>No entries yet</div>
          <div style={{fontSize:16,color:'var(--muted)',lineHeight:1.6}}>Log symptoms in Her Week tab and they'll appear here for the OB report.</div>
        </div>
      ):(
        <>
          <div className="card" style={{marginBottom:12}}>
            <div style={{display:'flex',justifyContent:'space-between',marginBottom:12}}>
              <div className="sec-label" style={{marginBottom:0}}>Symptom frequency</div>
              <div style={{fontSize:13,color:'var(--muted)'}}>{recent.length} entries</div>
            </div>
            {sorted.map(([id,count])=>{
              const sym=SYMPTOMS.find(s=>s.id===id)||{label:id,color:'var(--muted)'};
              return (
                <div key={id} style={{marginBottom:10}}>
                  <div style={{display:'flex',justifyContent:'space-between',marginBottom:4}}>
                    <span style={{fontSize:15,color:'var(--text2)'}}>{sym.label}</span>
                    <span style={{fontSize:15,color:'var(--muted)',fontWeight:500}}>{count}×</span>
                  </div>
                  <div style={{height:5,background:'var(--border)',borderRadius:4,overflow:'hidden'}}>
                    <div style={{height:'100%',width:`${(count/maxC)*100}%`,background:sym.color||'var(--navy)',borderRadius:4,transition:'width 0.4s'}}/>
                  </div>
                </div>
              );
            })}
          </div>
        </>
      )}

      <button className="btn" onClick={onShare} style={{background:copied?'var(--sage)':'linear-gradient(135deg,var(--terra),#A85A3A)',color:'#fff',marginBottom:12}}>
        {copied?'✓ Copied!':navigator.share?'📤 Share with OB':'📋 Copy Report for OB'}
      </button>

      {recent.length>0&&(
        <div>
          <div className="sec-label" style={{marginBottom:8}}>Preview</div>
          <pre style={{fontFamily:"'DM Mono','Courier New',monospace",fontSize:11,lineHeight:1.7,color:'var(--text2)',whiteSpace:'pre-wrap',wordBreak:'break-word',background:'var(--card2)',borderRadius:12,padding:14,border:'1px solid var(--border)'}}>{generateReport(entries,appointments,week,reportDays,config)}</pre>
        </div>
      )}

      {entries.length>0&&<div style={{textAlign:'center',marginTop:14}}><span onClick={onClear} style={{fontSize:13,color:'var(--terra)',cursor:'pointer',opacity:0.7}}>Clear symptom logs</span></div>}
    </div>
  );
}

// ─── SETTINGS ─────────────────────────────────────────────────────────────
function SettingsModal({ config, setConfig, onClose }) {
  const [d, setD] = useState(config);
  const u = patch => setD(prev=>({...prev,...patch}));
  const L = ({children}) => <div style={{fontSize:11,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:6,fontWeight:500}}>{children}</div>;

  return (
    <div className="modal-full">
      <div style={{background:'var(--navy)',padding:'calc(env(safe-area-inset-top,0px)+14px) 20px 14px',display:'flex',alignItems:'center',justifyContent:'space-between',flexShrink:0}}>
        <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:22,fontWeight:600,color:'#fff'}}>Settings</div>
        <button onClick={onClose} style={{background:'rgba(255,255,255,0.15)',border:'none',color:'#fff',width:30,height:30,borderRadius:'50%',cursor:'pointer',fontSize:18,display:'flex',alignItems:'center',justifyContent:'center'}}>✕</button>
      </div>
      <div style={{flex:1,overflowY:'auto',padding:'18px 16px 32px'}}>
        <L>Due date</L>
        <input type="date" className="text-input" value={d.dueDate} onChange={e=>u({dueDate:e.target.value})} style={{marginBottom:14}}/>

        <L>Mother's name</L>
        <input className="text-input" value={d.motherName} onChange={e=>u({motherName:e.target.value})} style={{marginBottom:14}}/>

        <L>Partner's name</L>
        <input className="text-input" value={d.partnerName} onChange={e=>u({partnerName:e.target.value})} style={{marginBottom:14}}/>

        <div style={{fontSize:11,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:8,fontWeight:500,marginTop:4}}>Twin configuration</div>
        <div className="card" style={{marginBottom:14}}>
          <L>Chorionicity</L>
          <div style={{display:'flex',gap:8,marginBottom:12}}>
            {[{v:'mono',label:'Mono (shared)'},{v:'di',label:'Di (separate)'}].map(o=>(
              <button key={o.v} onClick={()=>u({chorionicity:o.v})} style={{flex:1,padding:'9px',border:`1.5px solid ${d.chorionicity===o.v?'var(--navy)':'var(--border)'}`,borderRadius:10,background:d.chorionicity===o.v?'var(--navy)':'#fff',color:d.chorionicity===o.v?'#fff':'var(--dark)',fontFamily:"'Inter', sans-serif",fontSize:15,cursor:'pointer'}}>
                {o.label}
              </button>
            ))}
          </div>
          <L>Amnionicity</L>
          <div style={{display:'flex',flexWrap:'wrap',gap:8}}>
            {[{v:'di',l:'Di-amniotic (separate sacs)'},{v:'mono',l:'Mono-amniotic (shared sac)'},{v:'unknown',l:'Not yet confirmed'}].map(o=>(
              <button key={o.v} onClick={()=>u({amnionicity:o.v})} style={{flex:'1 0 45%',padding:'9px 10px',border:`1.5px solid ${d.amnionicity===o.v?'var(--navy)':'var(--border)'}`,borderRadius:10,background:d.amnionicity===o.v?'var(--navy)':'#fff',color:d.amnionicity===o.v?'#fff':'var(--dark)',fontFamily:"'Inter', sans-serif",fontSize:13,cursor:'pointer'}}>
                {o.l}
              </button>
            ))}
          </div>
          <div style={{fontSize:12,color:'var(--muted)',marginTop:8,lineHeight:1.5}}>
            {d.chorionicity==='mono'&&d.amnionicity==='di'?'MCDA — growth scans every 2 weeks from week 16. TTTS risk weeks 16–26.':d.chorionicity==='mono'&&d.amnionicity==='mono'?'MCMA — highest monitoring level.':d.amnionicity==='unknown'?'Confirm at next ultrasound.':'DCDA — growth scans every 4 weeks from week 20.'}
          </div>
        </div>

        <button className="btn btn-navy" onClick={()=>{setConfig(d);onClose();}}>Save Settings</button>
        <button className="btn-ghost" onClick={onClose} style={{width:'100%',marginTop:10}}>Cancel</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

  window.addEventListener('load',()=>{

</body>
